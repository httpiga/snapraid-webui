name: Test with Coverage
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      # Run backend and frontend tests in separate processes so auth middleware
      # tests are not affected by frontend test setup (happy-dom / WebSocket mock).
      - run: bun run --filter @snapraid-webui/backend test -- --coverage --coverage-reporter=lcov
      - run: bun run --filter @snapraid-webui/frontend test -- --coverage --coverage-reporter=lcov
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/coverage/lcov.info,frontend/coverage/lcov.info
          fail_ci_if_error: false # Codecov upload issue doesn't fail the job
